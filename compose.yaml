services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    ports: ["127.0.0.1:3000:3000"]
    environment: &job-environment
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      DATABASE_URL: postgresql://toolroom:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/toolroom
      REDIS_URL: redis://redis:6379
      MEDIA_JOBS_ENABLED: "true"
      JOB_STORAGE_DIR: /data/jobs
      MODEL_STORAGE_DIR: /models
    volumes: ["job-data:/data/jobs"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      storage-init: {condition: service_completed_successfully}
    mem_limit: 1g
    cpus: 2
    restart: unless-stopped
  migrate:
    build: {context: ., target: build}
    environment:
      DATABASE_URL: postgresql://toolroom:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/toolroom
    command: ["npm", "exec", "prisma", "migrate", "deploy", "--", "--schema", "infra/schema.prisma"]
    depends_on:
      postgres: {condition: service_healthy}
  storage-init:
    image: node:24-bookworm-slim
    user: root
    volumes: ["job-data:/data/jobs"]
    command: ["sh", "-c", "chown node:node /data/jobs && chmod 700 /data/jobs"]
  worker:
    build: {context: ., dockerfile: workers/Dockerfile}
    environment: *job-environment
    volumes:
      - job-data:/data/jobs
      - ./.runtime/models:/models:ro
    depends_on:
      migrate: {condition: service_completed_successfully}
      storage-init: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    read_only: true
    tmpfs: ["/tmp:size=128m,noexec,nosuid"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 96
    mem_limit: 2g
    cpus: 1
    stop_grace_period: 200s
    restart: unless-stopped
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: toolroom
      POSTGRES_USER: toolroom
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U toolroom"]
      interval: 5s
      retries: 10
    mem_limit: 512m
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
    mem_limit: 192m
    restart: unless-stopped
volumes:
  postgres-data:
  redis-data:
  job-data:
